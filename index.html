<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="Chainmate — a 3D chess roguelite." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Chainmate</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #view { display: block; width: 100vw; height: 100vh; outline: none; }
      #chainmate-loading {
        position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
        font: 300 15px/1.4 Georgia, 'Times New Roman', serif; letter-spacing: 0.42em; text-transform: uppercase;
        color: #d9b56a; text-indent: 0.42em; background: #07090d;
      }
      #chainmate-loading[data-state='failed'] { color: #e0736a; letter-spacing: 0.08em; text-transform: none; pointer-events: auto; }
      #chainmate-stats {
        position: fixed; left: 10px; bottom: 8px; pointer-events: none;
        font: 200 12px/1.3 'Cascadia Code', 'Cascadia Mono', Consolas, monospace; color: #9aa5ce;
      }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="chainmate-loading">Chainmate</div>
    <div id="chainmate-stats" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
